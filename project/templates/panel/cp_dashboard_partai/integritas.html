{% extends '/panel/cp_base_partai.html' %}

{% block body %}
<!-- Content Header (Page header) -->
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
            </div>
            <div class="col-sm-6">
                <form action="/dashboard-partai/tweet/refresh" method="POST">
                    <ol class="float-sm-right">
                        <button type="submit" class="btn btn-success">Refresh</button>
                    </ol>
                </form>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-sm-6">
                <h3 class="card-title"> <a href="/dashboard-partai/tweet">Hasil Crawaling Sentiment Partai</a> / Data Integritas Partai / <a href="/dashboard-partai/tweet/komunikator">Data Komunikator Partai</a> </h3>
            </div>
        </div>
    </div>
</section>

<!-- Start Integritas -->
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div id="example1_wrapper" class="dataTables_wrapper dt-bootstrap4">
                            <div class="row">
                                <div class="col-sm-12">
                                    <table id="example1" class="table table-bordered table-striped dataTable dtr-inline"
                                        role="grid" aria-describedby="example1_info">
                                        <thead>
                                            <tr role="row">
                                                <th class="sorting_asc" tabindex="0" aria-controls="example1"
                                                    rowspan="1" colspan="1" aria-sort="ascending"
                                                    aria-label="Rendering engine: activate to sort column descending">No
                                                </th>
                                                <th class="sorting_asc" tabindex="0" aria-controls="example1"
                                                    rowspan="1" colspan="1" aria-sort="ascending"
                                                    aria-label="Rendering engine: activate to sort column descending">
                                                    Tweet</th>
                                            </tr>
                                        </thead>
                                        {% for row in data %}
                                        <tr role="row" class="odd">
                                            <td tabindex="0" class="sorting_1">{{ loop.index }}</td>
                                            <td tabindex="0" class="sorting_1">{{row['tweet']}}</td>
                                        </tr>
                                        {% endfor %}
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- End Integritas -->
{% endblock %}
