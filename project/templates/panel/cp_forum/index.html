{% extends '/panel/cp_base.html' %}
{% block content %}
<section class="content-header">
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
                <h4>{{title}}</h4>
            </div>
            <div class="col-6">
                <a href="{{url_for('tambahforum')}}"
                class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i class="fas fa-plus"></i>&nbsp; Edit
                Forum</a>
            </div>
        </div>
    </div><!-- /.container-fluid -->
</section>
<div class="containe-fluidr">
    <div class="col">
        <div class="row">

            <table class="table">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">Judul</th>
                        <th scope="col">Tanggal</th>
                        <th scope="col">author</th>
                        <th scope="col">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in data%}
                    <tr>
                        <td>{{row['forum_judul']}}</td>
                        <td>{{row['created_at']}}</td>
                        <td>{{row['user_id']}}</td>
                        <td>
                            <a href="/dashboard/cp_forum/delete/{{row['forum_id']}}"><button
                                    class="btn btn-sm btn-danger">Hapus</button></a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>
</div>
{% endblock %}
