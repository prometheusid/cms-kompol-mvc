{% extends '/panel/cp_base1.html' %}

{% block body %}
<!-- Content Header (Page header) -->
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{title}}</h1>
            </div>
            <div class="col-sm-6">
                <form action="/dashboard/survey/dewan/generate" method="POST">
                    <ol class="float-sm-right">
                        <button type="submit" class="btn btn-success">Generate</button>
                    </ol>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Main content -->
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">DPRD / <a href="/dashboard/survey/result/partai">Partai</a></h3>
                    </div>
                    <div class="card-body">
                        <div id="example1_wrapper" class="dataTables_wrapper dt-bootstrap4">
                            <div class="row">

                            </div>
                            <div class="row">
                                <div class="col-sm-12">
                                    <table id="example1" class="table table-bordered table-striped dataTable dtr-inline"
                                        role="grid" aria-describedby="example1_info">
                                        <thead>
                                            <tr role="row">
                                                <th class="sorting_asc" tabindex="0" aria-controls="example1"
                                                    rowspan="1" colspan="1" aria-sort="ascending"
                                                    aria-label="Rendering engine: activate to sort column descending">No
                                                </th>
                                                <th class="sorting" tabindex="0" aria-controls="example1" rowspan="1"
                                                    colspan="1"
                                                    aria-label="Platform(s): activate to sort column ascending">Nama
                                                    Dewan</th>
                                                <th class="sorting_desc" tabindex="0" aria-controls="example1"
                                                    rowspan="1" colspan="1" aria-sort="descending"
                                                    aria-label="Rendering engine: activate to sort column descending">
                                                    Jumlah Pemilih Survey</th>
                                                <th class="sorting_desc" tabindex="0" aria-controls="example1"
                                                    rowspan="1" colspan="1" aria-sort="descending"
                                                    aria-label="Rendering engine: activate to sort column descending">
                                                    Point Eksistensi</th>
                                                <th class="sorting_desc" tabindex="0" aria-controls="example1"
                                                    rowspan="1" colspan="1" aria-sort="descending"
                                                    aria-label="Rendering engine: activate to sort column descending">
                                                    Point Citra</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {% for row in data %}
                                            <tr role="row" class="odd">
                                                <td tabindex="0" class="sorting_1">{{ loop.index }}</td>
                                                <td>{{row['nama_user']}}</td>
                                                <td tabindex="0" class="sorting_1">{{row['jumlah']}}</td>
                                                <td tabindex="0" class="sorting_1">{{row['eksistensi']}}</td>
                                                <td tabindex="0" class="sorting_1">{{row['citra']}}</td>
                                            </tr>
                                            {% endfor %}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- /.card-body -->
                </div>
                <!-- /.card -->
            </div>
            <!-- /.col -->
        </div>
        <!-- /.row -->
    </div>
    <!-- /.container-fluid -->
</section>

{% endblock %}
