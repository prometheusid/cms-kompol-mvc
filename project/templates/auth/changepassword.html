<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Forgot Password</title>

    <!-- Custom fonts for this template-->
    <link href="{{url_for ('static', filename='css/all.min.css')}}" rel="stylesheet" type="text/css" />
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet" />

    <!-- Custom styles for this template-->
    <link href="{{url_for ('static', filename='css/sb-admin-2.min.css')}}" rel="stylesheet" />
</head>

<body class="bg-gradient-primary">
    <div class="container">
        {% for message in get_flashed_messages() %}
        {% if response == "error" %}
        <div class="alert alert-danger" role="alert">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{ message }}
        </div>
        {% endif %}
        {% if response == "success" %}
        <div class="alert alert-success" role="alert">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{ message }}
        </div>
        {% endif %}
        {% endfor %}
    </div>

    <div class="container">
        <div class="col-md-12">
            <div class="card border-0 shadow-lg my-5">
                <div class="card-body">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-md-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Masukan Password Baru Anda</h1>
                                </div>
                                <form class="user" action="/change-password/new-password" method="POST">
                                    <input type="hidden" id="email" name="email"
                                        value="{{email}}">
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user" name="password"
                                            placeholder="Password" />
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user"
                                            name="validate_password" placeholder="Ulangi Password" />
                                    </div>
                                    <button class="btn btn-primary btn-user btn-block">
                                        <h6>Change Password</h6>
                                    </button>
                                </form>
                                <hr />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{{url_for ('static', filename='js/jquery.min.js')}}"></script>
    <script src="{{url_for ('static', filename='js/bootstrap.bundle.min.js')}}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{{url_for ('static', filename='js/jquery.easing.min.js')}}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{{url_for ('static', filename='js/sb-admin-2.min.js')}}"></script>
</body>

</html>
