{% extends '/public/index.html' %}
{% block content %}
<section class="home">
    <div class="container">
        <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin-top: 2rem">
            <h1 class="h3 mb-0 text-white-800">Rekomendasi Partai</h1>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <p>
                    <h4>{{data['judul']}}</h4>
                </p>
                <p><img src="{{ url_for('uploadedFiles', filename=data['images']) }}" class="image-up" /></p>
                <p>{{data['content']|safe}}</p><br>
                <div class="bottom">
                    <p style="margin-right: 1.5em">{{data['created_at'].strftime('%d %B %Y - %H:%M')}}</p>
                    <!-- <p class="comment-count">Perolehan : {{data['nama_user']}}</p> -->
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
