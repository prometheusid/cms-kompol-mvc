{% extends '/public/index.html' %} {% block content %}
<section class="py-5" style="margin-top: 5px">
  <div class="container">
    <div class="row">
      <div class="col">
        <form action="/forum/tambah" method="POST">
          <input
            type="text"
            class="form-control"
            id="idForum"
            name="idForum"
            hidden
          />
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Judul Forum</label
            >
            <input
              type="text"
              class="form-control"
              id="judul"
              placeholder="Judul"
              name="judulForum"
            />
          </div>
          <div class="mb-3">
            <textarea
              class="form-control"
              id="summernote"
              rows="3"
              name="content"
            ></textarea>
          </div>
          <button type="submit" name="submit" class="btn btn-primary text-light">
            Simpan
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
<script>
  $("#summernote").summernote({
    tabsize: 2,
    height: 350,
    toolbar: [
      ["style", ["style"]],
      ["font", ["bold", "underline", "clear"]],
      ["color", ["color"]],
      ["para", ["ul", "ol", "paragraph"]],
      ["table", ["table"]],
      ["insert", ["link", "picture", "video"]],
      ["view", ["fullscreen", "codeview", "help"]],
    ],
  });
</script>
{% endblock %}
