{% extends '/public/index.html' %} {% block content %}
<div class="container">
  <div
    class="d-sm-flex align-items-center justify-content-between mb-4"
    style="margin-top: 2rem"
  >
    <h1 class="h3 mb-0 text-white-800">INFO PUBLIK</h1>
    {% if session['id'] %}
    <a
      href="{{ url_for('tambahinfo') }}"
      class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"
      ><i class="fas fa-plus"></i>&nbsp; Tambah Baru</a
    >
    {% endif %}
  </div>
  <!-- ##### Intro News Area Start ##### -->
  <div class="intro-news-area">
    <div class="container">
      <div class="row justify-content-center">
        <!-- Intro News Tabs Area -->
        <div class="col-12">
          <div class="intro-news-tab">
            <!-- Intro News Filter -->
            <div class="intro-news-filter d-flex justify-content-between">
              <h6>All the news</h6>
            </div>

            <div class="tab-content" id="nav-tabContent">
              <div
                class="tab-pane fade show active"
                id="nav-1"
                role="tabpanel"
                aria-labelledby="nav1"
              >
                <div class="row">
                  {% for row in data%}
                  <!-- Single News Area -->
                  <div class="col-12 col-sm-4">
                    <div
                      class="single-blog-post style-2 mb-5 card shadow card-body"
                    >
                      <!-- Blog Thumbnail -->
                      <div class="blog-thumbnail">
                        <a href="info/detail/{{row['info_id']}}"
                          ><img
                            src="{{ url_for('uploadedFiles', filename=row['thumb']) }}"
                            alt=""
                        /></a>
                      </div>

                      <!-- Blog Content -->
                      <div class="blog-content">
                        <span class="post-date">{{row['created_at'].strftime('%d %B %Y - %H:%M')}}</span>
                        <a
                          href="info/detail/{{row['info_id']}}"
                          class="post-title"
                          >{{row['judul_info']}}</a
                        >
                        <a
                          href="info/detail/{{row['info_id']}}"
                          class="post-author"
                          >{{row['nama_user']}}</a
                        >
                      </div>
                    </div>
                  </div>
                  {% endfor %}
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar Widget -->

        <!-- Newsletter Widget -->
        <!-- <div class="single-widget-area newsletter-widget mb-30">
              <h4>Subscribe to our newsletter</h4>
              <form action="#" method="post">
                <input type="email" name="nl-email" id="nlemail" placeholder="Your E-mail">
                <button type="submit" class="btn newsbox-btn w-100">Subscribe</button>
              </form>
              <p class="mt-30">Nullam lacinia ex eleifend orci porttitor, suscipit interdum augue condimentum. Etiam pretium turpis eget nibh . volutpat lobortis.</p>
            </div> -->

        <!-- Add Widget -->
        <!-- <div class="single-widget-area add-widget mb-30">
              <a href="#">
                <img src="img/bg-img/add3.png" alt="">
              </a>
            </div> -->
        <!--  </div>
        </div>  -->
      </div>
    </div>
  </div>
  <!-- ##### Intro News Area End ##### -->
  {% endblock%}
</div>
