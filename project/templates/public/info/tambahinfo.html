{% extends '/public/index.html' %} {% block content %}
<section class="py-5" style="margin-top: 5px">
  <div class="container">
    <div class="row">
      <div class="col">
        <form action="/pub_info/tambahinfo" method="POST" enctype=multipart/form-data> <div class="mb-3">
          <label for="exampleFormControlInput1" class="form-label">Judul Info</label>
          <input type="text" class="form-control" id="judul-info" name="judul-info" />
      </div>
      <div class="mb-3">
        <label class="form-label">Isi Info</label>
        <textarea class="form-control" id="summernote" rows="3" name="isi-info"></textarea>
      </div>
      <div class="forum-group">
        <label for="file">Upload Gambar</label><br>
        <input type=file name=file>
      </div><br>
      <button type="submit" name="submit" class="btn btn-primary">
        Simpan
      </button>
      </form>
    </div>
  </div>
  </div>
</section>
<script>
  $("#summernote").summernote({
    placeholder: "Tulis sesuatu disini",
    tabsize: 2,
    height: 350,
    toolbar: [
      ["style", ["style"]],
      ["font", ["bold", "underline", "clear"]],
      ["color", ["color"]],
      ["para", ["ul", "ol", "paragraph"]],
      ["table", ["table"]],
      ["insert", ["link", "picture", "video"]],
      ["view", ["fullscreen", "codeview", "help"]],
    ],
  });
</script>
{% endblock %}
